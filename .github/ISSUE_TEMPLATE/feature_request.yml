name: Feature request
description: An idea for something new, or a way to make 2DriveScan better.
title: "[Idea] "
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: Thanks for sharing your idea! Every request is read, also the small ones.
  - type: textarea
    id: problem
    attributes:
      label: What would you like to do?
      description: Describe what you are trying to achieve, or what bothers you now.
      placeholder: "When I clean up my drive, I want to ..."
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: How could 2DriveScan help?
      description: Your idea for how it could work. Mockups, sketches or examples from other apps are welcome.
  - type: dropdown
    id: os
    attributes:
      label: Which platforms is this about?
      multiple: true
      options:
        - macOS
        - Windows
        - Linux
        - All of them
