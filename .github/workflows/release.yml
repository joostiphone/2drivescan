name: Release

# Builds installers for macOS, Windows and Linux and attaches them to a
# GitHub release. Triggered by pushing a tag like v0.2.0 (the tag must match
# the version in src-tauri/Cargo.toml), or manually from the Actions tab.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  create-release:
    name: Create draft release
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.release.outputs.result }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Read app version
        id: version
        shell: bash
        run: |
          version=$(grep -m1 '^version' src-tauri/Cargo.toml | sed -E 's/version *= *"([^"]+)"/\1/')
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [[ "${GITHUB_REF_TYPE}" == "tag" && "${GITHUB_REF_NAME}" != "v$version" ]]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match app version v$version (src-tauri/Cargo.toml)"
            exit 1
          fi

      - name: Create or reuse draft release
        id: release
        uses: actions/github-script@v7
        env:
          VERSION: ${{ steps.version.outputs.version }}
        with:
          script: |
            const fs = require('fs');
            const tag = `v${process.env.VERSION}`;
            const { owner, repo } = context.repo;
            const releases = await github.paginate(github.rest.repos.listReleases, { owner, repo });
            const existing = releases.find((r) => r.tag_name === tag);
            if (existing) return existing.id;
            const body = fs.readFileSync('.github/release-notes.md', 'utf8').replaceAll('{{VERSION}}', process.env.VERSION);
            const { data } = await github.rest.repos.createRelease({
              owner,
              repo,
              tag_name: tag,
              name: `2DriveScan ${tag}`,
              body,
              draft: true,
              prerelease: false,
              target_commitish: context.sha,
            });
            return data.id;

  build:
    name: Build (${{ matrix.name }})
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS universal
            platform: macos-latest
            args: --target universal-apple-darwin
            rust_targets: aarch64-apple-darwin,x86_64-apple-darwin
          - name: Windows x64
            platform: windows-latest
            args: ''
            rust_targets: ''
          - name: Windows ARM64
            platform: windows-latest
            args: --target aarch64-pc-windows-msvc --bundles nsis
            rust_targets: aarch64-pc-windows-msvc
          - name: Linux x64
            platform: ubuntu-22.04
            args: ''
            rust_targets: ''
          - name: Linux ARM64
            platform: ubuntu-22.04-arm
            args: ''
            rust_targets: ''
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: startsWith(matrix.platform, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev \
            libxdo-dev libssl-dev patchelf file xdg-utils

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - uses: swatinem/rust-cache@v2
        with:
          key: ${{ matrix.name }}

      - run: npm ci

      # Optional macOS signing + notarization. Enabled only when the repository
      # secrets exist (see docs/macos-signing.md); otherwise the app is ad-hoc
      # signed. Empty variables must not reach Tauri, so they are exported
      # conditionally instead of being set on the build step.
      - name: Configure macOS signing
        if: startsWith(matrix.platform, 'macos')
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          export_var() {
            local delim="EOF_$(openssl rand -hex 8)"
            { echo "$1<<$delim"; printf '%s\n' "${!1}"; echo "$delim"; } >> "$GITHUB_ENV"
          }
          if [[ -n "$APPLE_CERTIFICATE" && -n "$APPLE_SIGNING_IDENTITY" ]]; then
            export_var APPLE_CERTIFICATE
            export_var APPLE_CERTIFICATE_PASSWORD
            export_var APPLE_SIGNING_IDENTITY
            echo "Signing with a Developer ID certificate."
            if [[ -n "$APPLE_ID" && -n "$APPLE_PASSWORD" && -n "$APPLE_TEAM_ID" ]]; then
              export_var APPLE_ID
              export_var APPLE_PASSWORD
              export_var APPLE_TEAM_ID
              echo "Notarization enabled."
            else
              echo "::warning::APPLE_ID / APPLE_PASSWORD / APPLE_TEAM_ID missing: the app is signed but not notarized."
            fi
          else
            echo "No signing secrets configured: building an ad-hoc signed app."
          fi

      # Update packages are signed with the updater key (minisign). The app
      # only installs updates signed with it; the public half is in
      # tauri.conf.json (plugins.updater.pubkey). Without the secret the
      # release is built without update packages.
      - name: Configure update signing
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if [[ -n "$TAURI_SIGNING_PRIVATE_KEY" ]]; then
            for v in TAURI_SIGNING_PRIVATE_KEY TAURI_SIGNING_PRIVATE_KEY_PASSWORD; do
              delim="EOF_$(openssl rand -hex 8)"
              { echo "$v<<$delim"; printf '%s\n' "${!v}"; echo "$delim"; } >> "$GITHUB_ENV"
            done
            echo "UPDATER_ARGS=" >> "$GITHUB_ENV"
            echo "Update packages will be signed."
          else
            echo "UPDATER_ARGS=--config src-tauri/tauri.no-updater.conf.json" >> "$GITHUB_ENV"
            echo "::warning::TAURI_SIGNING_PRIVATE_KEY is not set: building without update packages."
          fi

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          releaseId: ${{ needs.create-release.outputs.release_id }}
          args: ${{ matrix.args }} ${{ env.UPDATER_ARGS }}
          # Windows users install the setup.exe; update them with the same installer.
          updaterJsonPreferNsis: true

  publish-release:
    name: Publish release
    needs: [create-release, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        env:
          RELEASE_ID: ${{ needs.create-release.outputs.release_id }}
        with:
          script: |
            await github.rest.repos.updateRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: Number(process.env.RELEASE_ID),
              draft: false,
              make_latest: 'true',
            });
