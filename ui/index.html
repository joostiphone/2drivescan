<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark light" />
    <title>2DriveScan</title>
    <link rel="icon" type="image/png" href="img/logo.png" />
    <link rel="stylesheet" href="css/app.css" />
    <script type="module" src="js/main.js"></script>
  </head>
  <body>
    <div class="backdrop" aria-hidden="true"></div>
    <div id="app">
      <header class="titlebar" data-tauri-drag-region>
        <div class="titlebar-left" data-tauri-drag-region>
          <button id="btn-home" class="icon-btn" type="button"></button>
          <button id="btn-up" class="icon-btn" type="button"></button>
        </div>
        <nav id="crumbs" class="crumbs" data-tauri-drag-region></nav>
        <div class="brand-mini" data-tauri-drag-region>
          <img src="img/logo.png" alt="" width="20" height="20" />
          <span>2DriveScan</span>
        </div>
        <div class="titlebar-right" data-tauri-drag-region>
          <button id="btn-rescan" class="icon-btn" type="button"></button>
          <button id="btn-theme" class="icon-btn" type="button"></button>
        </div>
      </header>

      <main id="screens">
        <section id="screen-home" class="screen" hidden></section>
        <section id="screen-scan" class="screen" hidden></section>
        <section id="screen-result" class="screen" hidden></section>
      </main>
    </div>

    <div id="tooltip" class="tooltip" hidden></div>
    <div id="ctxmenu" class="ctxmenu" hidden></div>
    <div id="drag-ghost" class="drag-ghost" hidden></div>
    <div id="modal-root"></div>
    <div id="toast-root" class="toast-root"></div>
  </body>
</html>
