# 2drivescan.app: nginx vhost (Laravel + PHP-FPM), as used in production.
# Installed as /etc/nginx/sites-available/2drivescan by deploy/install.sh.
#
# HTTPS comes from a Cloudflare Tunnel that forwards https://2drivescan.app and
# https://www.2drivescan.app to port 80 of this server (no router ports open).
# Laravel redirects www. to the bare domain. When the tunnel connector runs on
# another host, add its address to TRUSTED_PROXIES in shared/.env.

# Shortened IP addresses in the access log (last part removed, kept 14 days).
map $http_cf_connecting_ip $drivescan_client_ip {
    ""      $remote_addr;
    default $http_cf_connecting_ip;
}
map $drivescan_client_ip $drivescan_anon_ip {
    ~^(?P<a>\d+\.\d+\.\d+)\.\d+$          $a.0;
    ~^(?P<a>[0-9a-fA-F]+:[0-9a-fA-F]+:[0-9a-fA-F]+): $a::;
    default                               0.0.0.0;
}
log_format drivescan_anon '$drivescan_anon_ip - [$time_local] "$request" $status $body_bytes_sent "$http_referer" "$http_user_agent" $request_time';

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name 2drivescan.app www.2drivescan.app;

    root /var/www/2drivescan/current/website/public;
    index index.php;
    charset utf-8;

    server_tokens off;
    access_log /var/log/nginx/2drivescan.access.log drivescan_anon;
    error_log /var/log/nginx/2drivescan.error.log warn;

    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 512;
    gzip_types text/plain text/css text/xml application/xml application/javascript application/json image/svg+xml;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Never serve dotfiles (.env, .git, ...), except .well-known.
    location ~ /\.(?!well-known) {
        deny all;
    }

    # Static files: the app demo, screenshots, CSS and JS (site.css/site.js carry ?v=mtime).
    # Safe as a regex here: no route of this site serves these extensions from PHP.
    location ~* \.(?:css|js|png|jpg|svg|ico|webp|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public";
        add_header X-Content-Type-Options "nosniff" always;
        access_log off;
        try_files $uri =404;
    }

    location = /favicon.ico { access_log off; log_not_found off; try_files $uri =404; }
    location = /robots.txt  { access_log off; log_not_found off; try_files $uri =404; }

    error_page 404 /index.php;

    location = /index.php {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/2drivescan.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 60s;
    }

    # Any other .php file is never executed.
    location ~ \.php$ {
        return 404;
    }
}
