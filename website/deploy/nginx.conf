# Example nginx site for 2drivescan.app (Laravel + PHP-FPM).
# Copy to /etc/nginx/sites-available/2drivescan, adjust the PHP-FPM socket,
# link it into sites-enabled and reload nginx.
#
# HTTPS: .app domains only work over HTTPS. The domain lives in Cloudflare, so
# a Cloudflare Tunnel (cloudflared) forwards https://2drivescan.app and
# https://www.2drivescan.app to http://localhost:80 on this server. No router
# ports need to be opened. Laravel redirects www. to the bare domain.

server {
    listen 80;
    listen [::]:80;
    server_name 2drivescan.app www.2drivescan.app;

    root /var/www/2drivescan/website/public;
    index index.php;
    charset utf-8;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Static files: the app demo, screenshots, CSS and JS.
    location ~* \.(?:css|js|png|jpg|svg|ico|webp|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    error_page 404 /index.php;

    location ~ ^/index\.php(/|$) {
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
