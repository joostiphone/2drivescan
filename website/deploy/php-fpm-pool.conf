; 2drivescan.app PHP-FPM pool. Installed by deploy/install.sh as
; /etc/php/<version>/fpm/pool.d/2drivescan.conf. The site has no uploads and
; no sessions, so no limits or cookie settings are needed for those.
[2drivescan]
user = www-data
group = www-data
listen = /run/php/2drivescan.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0660

pm = dynamic
pm.max_children = 12
pm.start_servers = 3
pm.min_spare_servers = 2
pm.max_spare_servers = 5
pm.max_requests = 500

; Files written by the app (cache, logs) stay group-writable for the deploy user.
php_admin_value[umask] = 0002
; /var/www/2drivescan also covers ../CHANGELOG.md, ../ui and ../docs of each release.
php_admin_value[open_basedir] = /var/www/2drivescan:/tmp:/usr/share/php:/dev/urandom
php_admin_flag[expose_php] = off
php_admin_value[memory_limit] = 256M
php_admin_value[disable_functions] = exec,passthru,shell_exec,system,popen,pcntl_exec

security.limit_extensions = .php
