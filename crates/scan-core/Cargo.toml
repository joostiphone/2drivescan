[package]
name = "scan-core"
version = "0.5.0"
edition = "2021"
rust-version = "1.87"
license = "MIT"
description = "Fast, parallel disk-usage scanner that powers 2DriveScan"
repository = "https://github.com/joostiphone/2drivescan"
publish = false

[dependencies]
lz4_flex = "0.14"
rayon = "1.10"
serde = { version = "1", features = ["derive"] }
xxhash-rust = { version = "0.8", features = ["xxh3"] }

[dev-dependencies]
tempfile = "3"
