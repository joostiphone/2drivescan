[package]
name = "twodrivescan"
version = "0.2.1"
description = "2DriveScan – see what is taking up your disk space"
authors = ["2DriveScan contributors"]
license = "MIT"
repository = "https://github.com/joostiphone/2drivescan"
homepage = "https://2drivescan.app"
edition = "2021"
rust-version = "1.87"
publish = false

[[bin]]
name = "twodrivescan"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
scan-core = { path = "../crates/scan-core" }
tauri = { version = "2.12", features = [] }
tauri-plugin-dialog = "2.8"
tauri-plugin-opener = "2.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = { version = "0.40", default-features = false, features = ["disk"] }
trash = "5"
